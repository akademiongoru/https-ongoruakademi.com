<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğrenci Paneli | Öngörü Akademi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body { background:#2f2f2f; color:white; padding:20px; min-height:100vh; }
    header { background:#1f1f1f; padding:20px; border-bottom:3px solid #ff7a00; border-radius:10px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { color:#ff7a00; font-size:24px; }
    header a, .cikis-btn { color:white; text-decoration:none; background:#ff7a00; padding:8px 15px; border-radius:8px; font-weight:bold; border:none; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; gap:8px; }
    
    .giris-kutu { max-width:400px; margin:80px auto; background:#383838; padding:30px; border-radius:15px; border-top:4px solid #ff7a00; text-align:center; }
    .giris-kutu h2 { color:#ff7a00; margin-bottom:20px; }
    
    input, select, button { width:100%; padding:12px; margin-bottom:12px; background:#2f2f2f; border:1px solid #444; border-radius:8px; color:white; font-size:14px; outline:none; }
    button { background:#ff7a00; font-weight:bold; cursor:pointer; transition:.3s; border:none; }
    button:hover { opacity:0.9; }
    
    .panel { display:none; max-width:900px; margin:0 auto; }
    .kutu { background:#383838; padding:25px; border-radius:15px; border-top:4px solid #ff7a00; margin-bottom:20px; }
    .kutu h2 { color:#ff7a00; margin-bottom:15px; font-size:20px; display:flex; align-items:center; gap:10px; }
    
    .test-kart { background: #252525; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #ff7a00; display:flex; justify-content:space-between; align-items:center; }
    .deneme-kart { background: #252525; padding: 18px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid #ff7a00; }
    .deneme-header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #3d3d3d; padding-bottom:10px; margin-bottom:12px; }
    .deneme-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap:10px; text-align:center; background:#1e1e1e; padding:12px; border-radius:8px; }
    .deneme-stat-box { display:flex; flex-direction:column; gap:4px; }
    .deneme-stat-val { font-size:16px; font-weight:bold; }

    .soru-kart { background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #ff7a00; }
    .soru-kart h4 { color: #ff7a00; font-size: 15px; margin-bottom: 10px; }
    .secenekler { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .secenek-label { display: flex; align-items: center; gap: 10px; background: #1f1f1f; padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .secenek-label:hover { background: #333; }
    .secenek-label input[type="radio"] { width: auto; margin: 0; }

    .sonuc-kutusu { background: #1f1f1f; border: 2px solid #ff7a00; padding: 20px; border-radius: 10px; text-align: center; margin-top: 15px; display: none; }
    .cozuldu-rozet { background: #22c55e; color: white; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
  </style>
</head>
<body>

<header>
  <h1><i class="fa-solid fa-user-graduate"></i> Öngörü Akademi - Öğrenci Paneli</h1>
  <div>
    <span id="ogrenciIsmi" style="margin-right:15px; font-weight:bold; color:#ff7a00;"></span>
    <a href="index.html"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
    <button class="cikis-btn" id="cikisBtn" style="display:none;"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
  </div>
</header>

<div class="giris-kutu" id="girisAlani">
  <h2>Öğrenci Girişi</h2>
  <form id="ogrenciGirisForm">
    <input type="text" id="gKullaniciAdi" placeholder="Kullanıcı Adı / T.C." required autofocus>
    <input type="password" id="gSifre" placeholder="Şifre (Varsa)">
    <button type="submit" id="girisBtn">Giriş Yap</button>
  </form>
</div>

<div class="panel" id="panelAlani">
  
  <!-- KURUMSAL DENEME SINAVI SONUÇLARI KUTUSU -->
  <div class="kutu">
    <h2><i class="fa-solid fa-chart-column"></i> Kurumsal Deneme Sınavı Sonuçlarım</h2>
    <div id="denemeSonuclariListesi">Yükleniyor...</div>
  </div>

  <!-- BANA ATANAN ONLINE TESTLER KUTUSU -->
  <div class="kutu">
    <h2><i class="fa-solid fa-file-pen"></i> Bana Atanan Online Testler</h2>
    <div id="testlerListesi">Yükleniyor...</div>

    <div id="sinavEkrani" style="display:none; margin-top:20px; border-top: 2px dashed #ff7a00; padding-top:20px;">
      <h3 id="aktifTestBaslik" style="color:#ff7a00; margin-bottom:15px;"></h3>
      <form id="sinavFormu">
        <div id="sorularContainer"></div>
        <button type="submit" id="sinavBitirBtn" style="margin-top:15px; background:#22c55e;"><i class="fa-solid fa-check-double"></i> Testi Tamamla ve Gönder</button>
      </form>

      <div id="sonucKutusu" class="sonuc-kutusu">
        <h3><i class="fa-solid fa-trophy"></i> Test Sonucunuz İletildi!</h3>
        <p id="sonucMesaj" style="margin-top:10px; line-height: 1.6;"></p>
      </div>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4eNZiWTGnHUPSvdtCRvbymwFoBqQtqZk",
    authDomain: "weffg5-b84a8.firebaseapp.com",
    projectId: "weffg5-b84a8",
    messagingSenderId: "979023738185",
    appId: "1:979023738185:web:6327d7ba34be220de91698",
    measurementId: "G-P80RPZCSE7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let aktifOgrenci = null;
  let seciliTest = null;
  let seciliTestDocId = null;
  let cozulenTestIds = [];
  let tumTestlerCache = [];

  function escapeHtml(text) {
    if (!text) return "";
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  document.addEventListener("DOMContentLoaded", () => {
    const kayitli = localStorage.getItem("ongoru_ogrenci");
    if (kayitli) {
      try {
        aktifOgrenci = JSON.parse(kayitli);
        if (aktifOgrenci && aktifOgrenci.id) paneliAc();
      } catch (e) { localStorage.removeItem("ongoru_ogrenci"); }
    }
  });

  document.getElementById("ogrenciGirisForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const gGirilen = document.getElementById("gKullaniciAdi").value.trim();
    const gSifre = document.getElementById("gSifre").value.trim();
    const btn = document.getElementById("girisBtn");
    btn.disabled = true; btn.innerText = "Giriş Yapılıyor...";

    try {
      let eslesenOgrenci = null;
      const koleksiyonlar = ["kullanicilar", "ogrenciler"];

      for (const kol of koleksiyonlar) {
        const snapshot = await getDocs(collection(db, kol));
        
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          
          const dbKullanici = String(data.kullaniciAdi || data.kullanici_adi || data.tc || data.adSoyad || "").trim();
          const dbSifre = String(data.sifre || data.password || "").trim();

          const kAdiEslesiyor = dbKullanici.toLocaleUpperCase('tr-TR') === gGirilen.toLocaleUpperCase('tr-TR');
          const sifreEslesiyor = (dbSifre === "") || (dbSifre.toLocaleUpperCase('tr-TR') === gSifre.toLocaleUpperCase('tr-TR'));

          if (kAdiEslesiyor && sifreEslesiyor) {
            eslesenOgrenci = { id: docSnap.id, ...data };
          }
        });

        if (eslesenOgrenci) break;
      }

      if (eslesenOgrenci) {
        aktifOgrenci = eslesenOgrenci;
        localStorage.setItem("ongoru_ogrenci", JSON.stringify(aktifOgrenci));
        paneliAc();
      } else {
        alert("Kullanıcı adı veya şifre hatalı!");
      }

    } catch (err) { 
      alert("Giriş Hatası: " + err.message); 
    } finally { 
      btn.disabled = false; btn.innerText = "Giriş Yap"; 
    }
  });

  function paneliAc() {
    document.getElementById("girisAlani").style.display = "none";
    document.getElementById("panelAlani").style.display = "block";
    document.getElementById("cikisBtn").style.display = "inline-block";
    document.getElementById("ogrenciIsmi").innerText = "Hoş geldin, " + escapeHtml(aktifOgrenci.adSoyad || aktifOgrenci.kullaniciAdi || aktifOgrenci.ad);

    canliVerileriBaslat();
  }

  document.getElementById("cikisBtn").addEventListener("click", () => {
    localStorage.removeItem("ongoru_ogrenci");
    location.reload();
  });

  function canliVerileriBaslat() {
    // 1. Online Testleri Dinle
    onSnapshot(collection(db, "testler"), (snapshot) => {
      tumTestlerCache = [];
      snapshot.forEach(docSnap => {
        tumTestlerCache.push({ id: docSnap.id, ...docSnap.data() });
      });
      testArayuzunuGuncelle();
    });

    const qSonuc = query(collection(db, "test_sonuclari"), where("ogrenciId", "==", aktifOgrenci.id));
    onSnapshot(qSonuc, (sonucSnap) => {
      cozulenTestIds = [];
      sonucSnap.forEach(docSnap => {
        const data = docSnap.data();
        if (data.testId) cozulenTestIds.push(data.testId);
        if (data.testBaslik) cozulenTestIds.push(data.testBaslik);
      });
      testArayuzunuGuncelle();
    });

    // 2. Yönetici Tarafından Girilen Kurumsal Deneme Sonuçlarını Dinle
    const qDeneme = query(collection(db, "kurumsal_deneme_sonuclari"), where("ogrenciId", "==", aktifOgrenci.id));
    onSnapshot(qDeneme, (snapshot) => {
      const div = document.getElementById("denemeSonuclariListesi");
      div.innerHTML = "";

      if (snapshot.empty) {
        div.innerHTML = "<p style='color:#aaa;'>Henüz yayınlanmış bir deneme sınav sonucunuz bulunmuyor.</p>";
        return;
      }

      snapshot.forEach(docSnap => {
        const d = docSnap.data();
        const netHesap = d.net !== undefined ? Number(d.net).toFixed(2) : (d.dogru - (d.yanlis / 4)).toFixed(2);

        div.innerHTML += `
          <div class="deneme-kart">
            <div class="deneme-header">
              <div>
                <h3 style="color:#ff7a00; font-size:16px;">${escapeHtml(d.sinavAdi)}</h3>
                <small style="color:#aaa;"><i class="fa-regular fa-calendar"></i> Tarih: ${escapeHtml(d.tarih || '-')}</small>
              </div>
              <div style="background:#ff7a00; color:#fff; padding:6px 12px; border-radius:6px; font-weight:bold; font-size:14px;">
                ${escapeHtml(String(d.puan))} Puan
              </div>
            </div>

            <div class="deneme-grid">
              <div class="deneme-stat-box">
                <span style="font-size:12px; color:#aaa;">Doğru</span>
                <span class="deneme-stat-val" style="color:#22c55e;">${d.dogru}</span>
              </div>
              <div class="deneme-stat-box">
                <span style="font-size:12px; color:#aaa;">Yanlış</span>
                <span class="deneme-stat-val" style="color:#ff3b30;">${d.yanlis}</span>
              </div>
              <div class="deneme-stat-box">
                <span style="font-size:12px; color:#aaa;">Boş</span>
                <span class="deneme-stat-val" style="color:#aaa;">${d.bos}</span>
              </div>
              <div class="deneme-stat-box">
                <span style="font-size:12px; color:#aaa;">Toplam Net</span>
                <span class="deneme-stat-val" style="color:#ff7a00;">${netHesap}</span>
              </div>
              ${d.derece ? `
                <div class="deneme-stat-box">
                  <span style="font-size:12px; color:#aaa;">Derece/Sıra</span>
                  <span class="deneme-stat-val" style="color:#3b82f6;">${escapeHtml(d.derece)}</span>
                </div>
              ` : ''}
            </div>

            ${d.not ? `<div style="margin-top:10px; font-size:13px; background:#181818; padding:8px 12px; border-radius:6px; color:#ddd;"><i class="fa-solid fa-comment-dots" style="color:#ff7a00;"></i> <b>Öğretmen Notu:</b> ${escapeHtml(d.not)}</div>` : ''}
          </div>
        `;
      });
    });
  }

  function testArayuzunuGuncelle() {
    const div = document.getElementById("testlerListesi");
    div.innerHTML = "";
    let testVar = false;

    tumTestlerCache.forEach(t => {
      const testId = t.id;
      constHerkese = t.hedefTuru === "hepsi";
      const Sinifa = t.hedefTuru === "sinif" && t.hedefSinif === aktifOgrenci.sinif;
      const Kisiye = t.hedefTuru === "ogrenci" && t.hedefOgrenciId === aktifOgrenci.id;

      if (constHerkese || Sinifa || Kisiye) {
        testVar = true;
        const zatenCozuldu = cozulenTestIds.includes(testId) || cozulenTestIds.includes(t.baslik);
        
        const elem = document.createElement("div");
        elem.className = "test-kart";

        let aksiyonHTML = `<button class="coz-btn" style="width:auto; padding:6px 15px;"><i class="fa-solid fa-pen-to-square"></i> Testi Çöz</button>`;
        if (zatenCozuldu) {
          aksiyonHTML = `<span class="cozuldu-rozet"><i class="fa-solid fa-circle-check"></i> Çözüldü</span>`;
        }

        elem.innerHTML = `
          <div>
            <strong>${escapeHtml(t.baslik)}</strong>
            <div style="font-size:12px; color:#aaa;">Öğretmen: ${escapeHtml(t.ogretmenAd || 'Belirtilmedi')} | Tarih: ${escapeHtml(t.tarih || '')}</div>
          </div>
          ${aksiyonHTML}
        `;

        if (!zatenCozuldu) {
          elem.querySelector(".coz-btn").addEventListener("click", () => testiBaslat(t, testId));
        }

        div.appendChild(elem);
      }
    });

    if (!testVar) div.innerHTML = "<p style='color:#aaa;'>Size atanan aktif bir test bulunmuyor.</p>";
  }

  function testiBaslat(testData, docId) {
    if (cozulenTestIds.includes(docId) || cozulenTestIds.includes(testData.baslik)) {
      alert("Bu testi daha önce çözdünüz! Tekrar gönderemezsiniz.");
      return;
    }

    seciliTest = testData;
    seciliTestDocId = docId;
    document.getElementById("aktifTestBaslik").innerText = testData.baslik;
    const container = document.getElementById("sorularContainer");
    container.innerHTML = "";
    
    document.getElementById("sinavFormu").style.display = "block";
    document.getElementById("sonucKutusu").style.display = "none";

    testData.sorular.forEach((q, index) => {
      container.innerHTML += `
        <div class="soru-kart">
          <h4>Soru ${index + 1}: ${escapeHtml(q.text)}</h4>
          <div class="secenekler">
            <label class="secenek-label"><input type="radio" name="q_${q.id}" value="A"> A) ${escapeHtml(q.options ? q.options.A : '')}</label>
            <label class="secenek-label"><input type="radio" name="q_${q.id}" value="B"> B) ${escapeHtml(q.options ? q.options.B : '')}</label>
            <label class="secenek-label"><input type="radio" name="q_${q.id}" value="C"> C) ${escapeHtml(q.options ? q.options.C : '')}</label>
            <label class="secenek-label"><input type="radio" name="q_${q.id}" value="D"> D) ${escapeHtml(q.options ? q.options.D : '')}</label>
          </div>
        </div>
      `;
    });

    document.getElementById("sinavEkrani").style.display = "block";
  }

  document.getElementById("sinavFormu").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("sinavBitirBtn");

    try {
      const qCheck = query(
        collection(db, "test_sonuclari"), 
        where("ogrenciId", "==", aktifOgrenci.id), 
        where("testId", "==", seciliTestDocId)
      );
      const checkSnap = await getDocs(qCheck);

      if (!checkSnap.empty) {
        alert("Bu testi zaten çözüp gönderdiniz! İkinci kez gönderemezsiniz.");
        document.getElementById("sinavEkrani").style.display = "none";
        return;
      }
    } catch(err) {
      console.error("Kontrol hatası:", err);
    }

    if (!confirm("Testi bitirip göndermek istediğinize emin misiniz? (Her test tek seferliktir)")) return;

    let d = 0, y = 0, b = 0;
    seciliTest.sorular.forEach(q => {
      const secim = document.querySelector(`input[name="q_${q.id}"]:checked`);
      if (!secim) b++;
      else if (secim.value === q.answer) d++;
      else y++;
    });

    const basari = ((d / seciliTest.sorular.length) * 100) || 0;
    btn.disabled = true; btn.innerText = "İletiliyor...";

    try {
      await addDoc(collection(db, "test_sonuclari"), {
        testId: seciliTestDocId,
        ogretmenId: seciliTest.ogretmenId || "",
        ogrenciId: aktifOgrenci.id,
        ogrenciAd: aktifOgrenci.adSoyad || aktifOgrenci.kullaniciAdi || aktifOgrenci.ad,
        testBaslik: seciliTest.baslik,
        dogru: d,
        yanlis: y,
        bos: b,
        basari: basari,
        tarih: new Date().toLocaleString('tr-TR')
      });

      document.getElementById("sinavFormu").style.display = "none";
      document.getElementById("sonucMesaj").innerHTML = `Tamamlandı!<br> <strong>${d} Doğru, ${y} Yanlış, ${b} Boş.</strong><br> Başarı Oranı: %${basari.toFixed(1)}`;
      document.getElementById("sonucKutusu").style.display = "block";

      alert("Sonucunuz öğretmen paneline başarıyla iletildi!");
    } catch(err) {
      alert("Hata: " + err.message);
      btn.disabled = false; btn.innerText = "Testi Tamamla ve Gönder";
    }
  });
</script>
</body>
</html>
